; =============================================================================
; eink-ra01s-gp02  nRF52840 Build Environment
; =============================================================================
; Hardware:
;   MCU     : nRF52840 QFN48 (Normal Voltage, LDO only — no external DCDC inductor)
;   LoRa    : Ai-Thinker RA-01S (SX1262) — Phase 1
;   GPS     : Ai-Thinker GP-02 (L76K compatible) — Phase 2
;   EInk    : TBD (GxEPD2) — Phase 3
;   Boot    : Adafruit_nRF52_Bootloader v0.6.x, S140 v6.1.1
;   App     : 0x26000 (ldscript: nrf52840_s140_v6.ld)
; =============================================================================
; Bring-up phases:
;   Phase 0 (NOW) : No radio, no GPS, no screen. BLE + LED + button.
;   Phase 1       : HAS_RADIO=1, SX126X_* pins filled → uncomment USE_SX1262
;   Phase 2       : HAS_GPS=1, GPS_*_PIN filled → uncomment GPS section
;   Phase 3       : HAS_SCREEN=1, USE_EINK, EINK_* pins → add GxEPD2 lib_dep
; =============================================================================

[env:eink-ra01s-gp02]
extends = nrf52840_base

; -----------------------------------------------------------------------------
; Board JSON (boards/eink-ra01s-gp02.json):
;   ldscript = nrf52840_s140_v6.ld  → app ORIGIN = 0x26000
;   S140 v6.1.1, softdevice sd_fwid = 0x00B6
; -----------------------------------------------------------------------------
board = eink-ra01s-gp02

; -----------------------------------------------------------------------------
; CI level: extra → only built on full releases, never on every PR.
; Promote to custom_meshtastic_support_level = 1 when production-ready.
; -----------------------------------------------------------------------------
board_level = extra

; -----------------------------------------------------------------------------
; Debugger
; -----------------------------------------------------------------------------
debug_tool = jlink

; -----------------------------------------------------------------------------
; Build flags
; Phase 0: HAS_RADIO/HAS_GPS/HAS_SCREEN are 0 in variant.h — no flags needed.
; MESHTASTIC_EXCLUDE_* macros are in variant.h so IDE jump-to-definition works.
; -----------------------------------------------------------------------------
build_flags =
    ${nrf52840_base.build_flags}
    -I variants/nrf52840/eink-ra01s-gp02
    -D EINK_RA01S_GP02

    ; -- Diagnostics (temporary) --
    ; -D DEBUG_LOOP_TIMING            ; Print main loop delay + OSThread run intervals
    -D DEBUG_HEAP                   ; Print heap usage changes when threads run

    ; --- E-Ink dynamic refresh control ---
    ;
    -D USE_EINK
    ; USE_EINK_DYNAMICDISPLAY must be a global -D flag: the external GxEPD2 library
    ; (GxEPD2_EPD.cpp / GxEPD2_BW.h) uses it but never includes configuration.h.
    ; All other EINK_* tuning macros live in display_eink.h.
    -D USE_EINK_DYNAMICDISPLAY

    ; --- Phase 1: LoRa ---
    ; Uncomment when SX126X_* pins are filled in variant.h and HAS_RADIO=1:
    ; -D USE_SX1262

; -----------------------------------------------------------------------------
; Source filter: inherit nrf52_base exclusions, add variant sources
; -----------------------------------------------------------------------------
build_src_filter =
    ${nrf52_base.build_src_filter}
    -<mqtt/>
    +<../variants/nrf52840/eink-ra01s-gp02>

; -----------------------------------------------------------------------------
; Library dependencies
; Phase 0: only base deps needed.
; Phase 3 (E-Ink): add one of:
;   https://github.com/meshtastic/GxEPD2/archive/<hash>.zip   (meshtastic fork)
;   zinggjm/GxEPD2@1.6.8                                       (upstream)
; -----------------------------------------------------------------------------
lib_deps =
    ${nrf52840_base.lib_deps}
    ; PCF8563 RTC — SensorLib provides SensorPCF8563 used by RTC.cpp
    # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
    lewisxhe/SensorLib@0.3.4
    ; Phase 3 E-Ink — meshtastic GxEPD2 fork (pinned hash)
    ; # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
    https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip

; -----------------------------------------------------------------------------
; Upload
; UF2 via USB (nrfutil, 1200bps touch) — primary method for field updates.
; JLink SWD also supported for factory programming and debugging.
;
; boards.json -> nrf52840_s140_v6.ld : sets app ORIGIN = 0x26000, so nrfutil flash addr is 0x26000.
; `/home/him/.platformio/packages/framework-arduinoadafruitnrf52/cores/nRF5/linker/nrf52840_s140_v6.ld`
; -----------------------------------------------------------------------------
upload_protocol = jlink   ; override to use JLink for this session
; upload_port    = /dev/ttyACM0
; upload_flags =
;     -SelectEmuBySN
;     123456789   ; Select Emu By SN

; -----------------------------------------------------------------------------
; Monitor (USB CDC serial from SoftDevice log output)
; -----------------------------------------------------------------------------
; monitor_speed = 115200

; =============================================================================
; eink-ra01s-gp02-inkhud  —  InkHUD UI variant
; =============================================================================
; Extends eink-ra01s-gp02 (same board / debugger / upload).
; Only the differences are listed here.
; =============================================================================

[env:eink-ra01s-gp02-inkhud]
; Follow the t-echo-inkhud pattern: extend nrf52840_base + inkhud independently,
; never inherit the Screen variant. This avoids USE_EINK / GxEPD2 contamination.
extends = nrf52840_base, inkhud
board = eink-ra01s-gp02
board_level = extra
debug_tool = jlink
upload_protocol = jlink

build_flags =
    ${nrf52840_base.build_flags}
    ${inkhud.build_flags}
    -I variants/nrf52840/eink-ra01s-gp02
    -D EINK_RA01S_GP02
    -D EINK_RA01S_GP02_INKHUD
    ; InputBroker + HAS_BUTTON intentionally kept: SixKeyNavInput + Fn combos need them.
    ; Note: -U requires no space between flag and macro name in PlatformIO build_flags.
    -UMESHTASTIC_EXCLUDE_INPUTBROKER
    ; inkhud sets -DHAS_BUTTON=0; undefine it so peripherals.h can set HAS_BUTTON=1 cleanly.
    -UHAS_BUTTON

build_src_filter =
    ${nrf52_base.build_src_filter}
    ${inkhud.build_src_filter}
    +<../variants/nrf52840/eink-ra01s-gp02>
    -<motion/>  ; No accelerometer on this board; excludes MotionSensor.cpp compile errors

lib_deps =
    ${inkhud.lib_deps}
    ${nrf52840_base.lib_deps}
    # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
    lewisxhe/SensorLib@0.3.4
    ; GxEPD2 NOT included: InkHUD uses graphics/niche/Drivers/EInk/GDEY0213B74
