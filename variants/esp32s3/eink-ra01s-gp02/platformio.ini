; =============================================================================
; eink-ra01s-gp02  ESP32-S3 Build Environment
; =============================================================================
; Hardware:
;   MCU  : ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM)
;   LoRa : Ai-Thinker RA-01S (SX1262)
;   GPS  : Ai-Thinker GP-02
;   EInk : TODO
; =============================================================================

[env:eink-ra01s-gp02]
extends = esp32s3_base

; -----------------------------------------------------------------------------
; Board
; Custom board definition for ESP32-S3-WROOM-1U-N16R8:
;   16 MB Flash (QIO) + 8 MB PSRAM (OPI), memory_type=qio_opi
; See boards/esp32-s3-wroom-1u-n16r8.json
; -----------------------------------------------------------------------------
board = esp32-s3-wroom-1u-n16r8

; -----------------------------------------------------------------------------
; USB
; N16R8 has native USB OTG. Using USB-CDC avoids needing a USB-UART bridge.
; ARDUINO_USB_MODE=0  → TinyUSB CDC (software serial over USB)
; ARDUINO_USB_CDC_ON_BOOT=1 → CDC auto-starts on boot (required for CDC uploads)
; esp32s3_base injects -DARDUINO_USB_MODE=1; unflag it first.
; -----------------------------------------------------------------------------
build_unflags =
    ${esp32s3_base.build_unflags}
    -flto                           ; Disable LTO to avoid linker issues on this target
    -DARDUINO_USB_MODE=1            ; Override: use TinyUSB CDC instead of HW serial

; -----------------------------------------------------------------------------
; Build flags
; -----------------------------------------------------------------------------
build_flags =
    ${esp32s3_base.build_flags}

    ; -- Diagnostics (temporary) --
    -D DEBUG_LOOP_TIMING            ; Print main loop delay + OSThread run intervals
    -D DEBUG_HEAP                   ; Print heap usage changes when threads run

    ; -- Board identity --
    -D EINK_RA01S_GP02              ; Board identification macro
    ; PRIVATE_HW is defined in variant.h — no -D here to avoid redefinition warning

    ; -- PSRAM --
    -D BOARD_HAS_PSRAM              ; Required alongside qio_opi memory type

    ; -- USB --
    -D ARDUINO_USB_MODE=1           ; TinyUSB CDC
    -D ARDUINO_USB_CDC_ON_BOOT=0    ; Auto-start CDC serial on boot

    ; -- Include path --
    -I variants/esp32s3/eink-ra01s-gp02

    ; -- Warning suppression (inherited from esp32s3_base, repeated for clarity) --
    -Wno-odr
    -Wno-lto-type-mismatch
    -Wno-format
    -Wno-unused-variable
    -Wno-parentheses
    -Wno-type-limits
    -Wno-implicit-fallthrough
    -Wno-deprecated-declarations
    -Wno-ignored-qualifiers
    -Wno-array-bounds

; -----------------------------------------------------------------------------
; Upload
; USB-CDC requires esptool for initial flashing.
; After first flash, subsequent uploads work over the CDC port.
; -----------------------------------------------------------------------------
upload_protocol = esptool
upload_speed    = 921600

; -----------------------------------------------------------------------------
; Monitor
; -----------------------------------------------------------------------------
monitor_speed   = 115200
monitor_filters =
    esp32_exception_decoder   ; Remove typical terminal control codes from input
    time                      ; Add timestamp with milliseconds for each new line
    ; log2file                ; Log data to a file “platformio-device-monitor-*.log” located in the current working directory

; -----------------------------------------------------------------------------
; Library dependencies
; Inherit all base deps. Add display library here when eink is wired up:
;   zinggjm/GxEPD2@1.6.8
; -----------------------------------------------------------------------------
lib_deps =
    ${esp32s3_base.lib_deps}

;lib_ignore = ; No ignored libraries for now

; -----------------------------------------------------------------------------
; CI level
; board_level = extra → only built on full releases, not every PR.
; Change to custom_meshtastic_support_level = 1 when the board is production-ready.
; -----------------------------------------------------------------------------
board_level = extra

; -----------------------------------------------------------------------------
; Custom SDK: IDF 4.4 + arduino-esp32 v2.0.17 with CONFIG_PM_ENABLE=y
;
; Architecture (espressif32@6.13.0 SINGLE-PACKAGE pattern):
;   framework-arduinoespressif32  = arduino-esp32 v2.0.17 source + our custom
;                                   IDF static libs (tools/sdk/esp32s3/ replaced)
;
; How the tarball was built:
;   1. git clone --branch 2.0.17 arduino-esp32.git arduino-esp32-2.0.17
;   2. rm -rf arduino-esp32-2.0.17/tools/sdk/esp32s3
;   3. cp -r esp32-arduino-lib-builder/out/tools/sdk/esp32s3 arduino-esp32-2.0.17/tools/sdk/
;   4. cp esp32-arduino-lib-builder/out/tools/platformio-build-esp32s3.py arduino-esp32-2.0.17/tools/
;   5. tar cJf framework-arduinoespressif32-pm-idf44.tar.xz arduino-esp32-2.0.17/
; -----------------------------------------------------------------------------
platform = platformio/espressif32@6.13.0
platform_packages =
    framework-arduinoespressif32 @ file:///home/sainstroe/him/framework-arduinoespressif32-pm-idf44.tar.xz
